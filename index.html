<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿公六七網 - 迷因收藏室</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="阿公67網">
  <meta name="theme-color" content="#1a5e63">

  <link rel="stylesheet" href="style.css?v=67.13">
</head>
<body>

  <div id="menuToggle" class="menu-toggle" title="打開導覽選單">
    <i class="fas fa-bars"></i>
  </div>

  <div id="navDrawer" class="drawer">
    <div id="closeDrawer" class="close-drawer">
      <i class="fas fa-times"></i>
    </div>
    
    <div class="drawer-header">
      <h2>阿公<span class="highlight">67</span>網</h2>
      <p>你的67好夥伴</p>
    </div>

    <div id="userStatusArea" class="user-status-area"></div>

    <nav class="drawer-nav">
      <button class="nav-btn active" data-target="galleryView" data-type="image">
        <i class="fas fa-image"></i> 🖼️ 靜態圖片區
      </button>
      <button class="nav-btn" data-target="galleryView" data-type="gif">
        <i class="fas fa-bolt"></i> ⚡ 動態 GIF 區
      </button>
      <button class="nav-btn" data-target="galleryView" data-type="video">
        <i class="fas fa-video"></i> 🎬 短影片專區
      </button>
      <button class="nav-btn" data-target="uploadView">
        <i class="fas fa-cloud-upload-alt"></i> ☁️ 貢獻新藏品
      </button>
      
      <button id="adminNavBtn" class="nav-btn" data-target="adminView" style="display:none; color:#9b59b6;">
      <i class="fas fa-user-shield"></i> 👑 大總管審核後台
      </button>

      <hr style="width:100%; border:0; border-top:1px solid #ddd; margin: 10px 0;">
      
      <button id="loginNavBtn" class="nav-btn" style="color:var(--accent-color);">
        <i class="fas fa-sign-in-alt"></i> 🔑 登入 / 註冊
      </button>
      <button id="logoutNavBtn" class="nav-btn" style="display:none; color:#e74c3c;">
        <i class="fas fa-sign-out-alt"></i> 🚪 安全登出
      </button>
    </nav>
  </div>

  <div id="drawerOverlay" class="drawer-overlay"></div>

  <main id="mainContent">
    
    <section id="galleryView" class="view-section active-view">
      <header>
        <div class="header-content">
          <h1>阿公<span class="highlight">67</span>網</h1>
          <p class="subtitle">阿公的數位迷因收藏室</p>
          <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="在當前區域搜尋照片/標籤...">
            <i class="fas fa-times-circle search-clear-icon" id="searchClearBtn" title="清空搜尋"></i>
          </div>
        </div>
      </header>
      
      <div class="gallery-meta">
        <h2 id="galleryTitle"><i class="fas fa-image"></i> 🖼️ 靜態圖片區</h2>
      </div>
      <div id="gallery" class="gallery-container"></div>
    </section>

    <section id="uploadView" class="view-section">
      <header class="upload-header">
        <h1>貢獻<span class="highlight">新藏品</span></h1>
        <p class="subtitle">把你的酷東西交出來（支援 圖片 / GIF / MP4）</p>
      </header>

      <div class="upload-page-container">
        <div id="uploadSection" class="upload-card">
          <div class="upload-controls">
            <div class="file-drop-area">
              <label for="imageInput" class="custom-file-upload large-btn">
                <i class="fas fa-folder-open fa-2x"></i> <br>點擊選擇檔案
              </label>
              <input type="file" id="imageInput" accept="image/jpeg, image/png, image/webp, image/gif, video/mp4">
              
              <div style="margin-top: 15px;">
                <span id="fileNameDisplay" class="file-name-display">尚未選擇檔案</span>
                <span id="fileTypeBadge" class="file-type-badge" style="display:none;"></span>
              </div>
            </div>
            
            <div class="input-group">
              <label>檔案名稱</label>
              <input type="text" id="quoteInput" placeholder="請輸入檔案名稱">
            </div>
            <div class="input-group">
              <label>搜尋關鍵字 (標籤)</label>
              <input type="text" id="tagsInput" placeholder="需使用空白 逗號 分號分隔">
            </div>
            
            <button id="uploadButton" class="submit-btn">確定上傳藏品</button>
          </div>
        </div>
      </div>
    </section>

    <section id="adminView" class="view-section">
      <header class="upload-header">
        <h1>大總管<span class="highlight">審核後台</span></h1>
        <p class="subtitle">在這裡掌管生殺大權，核准路人成為 VIP</p>
      </header>
      <div class="upload-page-container">
           <div class="upload-card" style="max-width: 800px; width:100%;">
             
             <div style="display:flex; gap:10px; margin-bottom:20px; justify-content:center;">
               <button id="showUserSubView" class="action-btn upgrade" style="padding:10px 20px;"><i class="fas fa-users"></i> 會員權限管理</button>
               <button id="showMemeSubView" class="action-btn downgrade" style="padding:10px 20px; background:#9b59b6;"><i class="fas fa-images"></i> 全站藏品審核</button>
             </div>
             
             <div id="adminUserList" class="admin-user-list">
               <p style="text-align:center;">載入名單中...</p>
             </div>
             
             <div id="adminMemeList" class="admin-user-list" style="display:none;">
               <div class="search-wrapper" style="width: 100%; margin-bottom: 15px;">
                 <i class="fas fa-search search-icon"></i>
                 <input type="text" id="adminMemeSearchInput" placeholder="輸入關鍵字審核特定藏品...">
                 <i class="fas fa-times-circle search-clear-icon" id="adminMemeSearchClearBtn" title="清空搜尋"></i>
               </div>

               <div style="display:flex; gap:8px; margin-bottom:15px; justify-content:center; width:100%; flex-wrap:wrap;">
                 <button class="admin-sub-btn active" data-type="image">🖼️ 審核圖片</button>
                 <button class="admin-sub-btn" data-type="gif">⚡ 審核 GIF</button>
                 <button class="admin-sub-btn" data-type="video">🎬 審核影片</button>
               </div>

               <h3 id="adminMemeSubTitle" style="margin: 0 0 10px 0; color: #7f8c8d; font-size: 1rem;"><i class="fas fa-eye"></i> 當前正在審核：🖼️ 靜態圖片</h3>
               
               <div id="adminMemeCardsContainer" style="display:flex; flex-direction:column; gap:15px; width:100%;">
                 <p style="text-align:center;">載入全站藏品中...</p>
               </div>
             </div>
             
           </div>
         </div>
    </section>
  </main>

  <footer>
    <p>© 6767 阿公六七網 你的67好夥伴</p>
  </footer>

  <div id="authOverlay" class="auth-overlay"></div>
  <div id="authModal" class="auth-modal">
    <h2 id="modalTitle">登入阿公67網</h2>
    <form id="authForm" class="auth-form">
      <input type="text" id="authUsername" placeholder="輸入帳號ID (使用者名稱)" required>
      <div class="password-wrapper">
        <input type="password" id="authPassword" placeholder="輸入密碼 (4~20碼英數字)" required pattern="[a-zA-Z0-9]{4,20}" title="密碼長度需為 4~20 碼，且僅能使用英文與數字">
        <i class="fas fa-eye-slash" id="togglePasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <button type="submit" id="submitAuthBtn" class="auth-btn">安全登入</button>
    </form>
    <div id="switchAuthMode" class="switch-auth-mode">
      新朋友？<span class="auth-link">點此註冊新帳號</span>
    </div>
  </div> 

  <div id="changePwdModal" class="auth-modal">
    <h2 style="color: var(--accent-color);">修改密碼</h2>
    <form id="changePwdForm" class="auth-form">
      <div class="password-wrapper">
        <input type="password" id="oldPwdInput" placeholder="請輸入『舊密碼』" required>
        <i class="fas fa-eye-slash" id="toggleOldPasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <div class="password-wrapper">
        <input type="password" id="newPwdInput" placeholder="請輸入『新密碼』(4~20碼英數字)" required pattern="[a-zA-Z0-9]{4,20}" title="密碼長度需為 4~20 碼，且僅能使用英文與數字">
        <i class="fas fa-eye-slash" id="toggleNewPasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <div class="password-wrapper">
        <input type="password" id="confirmPwdInput" placeholder="再次確認『新密碼』" required pattern="[a-zA-Z0-9]{4,20}">
        <i class="fas fa-eye-slash" id="toggleConfirmPasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <button type="submit" id="submitChangePwdBtn" class="auth-btn" style="background: var(--accent-color); box-shadow: 0 4px 0 #b37400;">確認修改</button>
      <button type="button" id="cancelChangePwdBtn" class="auth-btn" style="background: #95a5a6; box-shadow: 0 4px 0 #7f8c8d; margin-top:-10px;">取消</button>
    </form>
  </div> 

  <script src="auth.js?v=67.19"></script>
  <script src="admin.js?v=67.19"></script>
  <script src="script.js?v=67.19"></script>
</body>
</html>
