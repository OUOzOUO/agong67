<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿公六七網 - 迷因收藏室</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  
  <link rel="manifest" href="./manifest.json">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="阿公67網">
  <meta name="theme-color" content="#1a5e63">

  <link rel="stylesheet" href="style.css?v=67.10">
</head>
<body>

  <div id="menuToggle" class="menu-toggle" title="打開導覽選單">
    <i class="fas fa-bars"></i>
  </div>

  <div id="drawerOverlay" class="drawer-overlay"></div>

  <div id="navDrawer" class="drawer">
    <div id="closeDrawer" class="close-drawer">
      <i class="fas fa-times"></i>
    </div>
    
    <div class="drawer-header">
      <h2>阿公<span class="highlight">67</span>網</h2>
      <p>數位迷因收藏室</p>
    </div>

    <div id="userStatusArea" class="user-status-area" style="display: none;">
      </div>

    <nav class="drawer-nav">
      <button class="nav-btn active" data-target="galleryView" data-type="image">
        <i class="fas fa-image"></i> 🖼️ 靜態圖片區
      </button>
      <button class="nav-btn" data-target="galleryView" data-type="gif">
        <i class="fas fa-bolt"></i> ⚡ 動態 GIF 區
      </button>
      <button class="nav-btn" data-target="galleryView" data-type="video">
        <i class="fas fa-video"></i> 🎬 短影片專區
      </button>
      <button class="nav-btn" data-target="uploadView" id="navUploadBtn" style="display: none;">
        <i class="fas fa-cloud-upload-alt"></i> ☁️ 貢獻新藏品
      </button>
      <button class="nav-btn" data-target="adminView" id="adminNavBtn" style="display: none;">
        <i class="fas fa-user-shield"></i> ⚙️ 大總管後台
      </button>
      <button class="nav-btn" id="loginNavBtn">
        <i class="fas fa-sign-in-alt"></i> <span>會員登入</span>
      </button>
      <button class="nav-btn" id="logoutNavBtn" style="display: none;">
        <i class="fas fa-sign-out-alt"></i> <span>安全登出</span>
      </button>
    </nav>
  </div>

  <div id="galleryView" class="view-section active-view">
    <header>
      <div class="header-content">
        <h1>阿公<span class="highlight">67</span>網</h1>
        <p class="subtitle">阿公的數位迷因收藏室</p>
        <div class="search-container">
          <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="在當前區域搜尋照片/描述/標籤...">
            <i class="fas fa-times-circle search-clear-icon" id="searchClearBtn" title="清空搜尋"></i>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="gallery-meta">
        <h2 id="galleryTitle"><i class="fas fa-image"></i> 🖼️ 靜態圖片區</h2>
      </div>
      <div id="gallery" class="gallery-container"></div>
    </main>
  </div>

  <div id="uploadView" class="view-section">
    <div class="upload-header">
      <h1>☁️ 貢獻<span class="highlight">新藏品</span></h1>
      <p class="subtitle">歡迎把好笑的酷東西送往阿公的雲端儲藏室</p>
    </div>
    <div class="upload-page-container">
      <div class="upload-card">
        <div class="upload-controls">
          <input type="file" id="imageInput" accept="image/*,video/*">
          <div class="file-drop-area">
            <label for="imageInput" class="custom-file-upload">
              <i class="fas fa-file-upload fa-3x"></i><br>
              點擊這裡選取您的藏品檔案
            </label>
            <span id="fileNameDisplay" class="file-name-display">尚未選擇檔案</span>
            <span id="fileTypeBadge" class="file-type-badge" style="display: none;"></span>
          </div>
          <div class="input-group">
            <label for="quoteInput">📝 藏品註解 / 經典台詞描述</label>
            <input type="text" id="quoteInput" placeholder="例如：這人太狠了、不可能吧...">
          </div>
          <div class="input-group">
            <label for="tagsInput">🏷️ 分類標籤 (多個標籤請用空格或逗號隔開)</label>
            <input type="text" id="tagsInput" placeholder="例如：迷因 搞笑 動態牛">
          </div>
          <button id="uploadButton" class="submit-btn">確定上傳藏品</button>
        </div>
      </div>
    </div>
  </div>

  <div id="adminView" class="view-section">
    <div class="upload-header">
      <h1>⚙️ 大總管<span class="highlight">後台管理系統</span></h1>
      <p class="subtitle">掌控藏品核准生死狀與權限調配</p>
    </div>
    <main>
      <div class="search-container" style="margin-bottom: 25px;">
        <div class="search-wrapper">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="adminMemeSearchInput" placeholder="在此搜尋後台審核列表中的藏品...">
          <i class="fas fa-times-circle search-clear-icon" id="adminMemeSearchClearBtn" title="清空搜尋"></i>
        </div>
      </div>
      <div style="display: flex; gap: 12px; margin-bottom: 30px; justify-content: center;">
        <button class="admin-sub-btn active" id="adminMemesBtn">藏品審核列表</button>
        <button class="admin-sub-btn" id="adminUsersBtn">帝國成員管理</button>
      </div>
      <div id="adminContent" class="gallery-container"></div>
    </main>
  </div>

  <div id="authOverlay" class="auth-overlay"></div>
  <div id="authModal" class="auth-modal">
    <h2 id="modalTitle">會員登入</h2>
    <form id="authForm" class="auth-form" onsubmit="return false;">
      <input type="text" id="authUsername" placeholder="請輸入使用者帳號" required autocomplete="username">
      <div class="password-wrapper">
        <input type="password" id="authPassword" placeholder="請輸入密碼" required autocomplete="current-password">
        <i class="fas fa-eye-slash" id="togglePasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <button type="submit" id="submitAuthBtn" class="auth-btn">確認登入</button>
    </form>
    <div id="switchAuthMode" class="switch-auth-mode">
      新朋友？<span class="auth-link" id="authLink">點此註冊新帳號</span>
    </div>
  </div>

  <div id="changePwdModal" class="auth-modal">
    <h2 style="color: var(--accent-color); text-align: center;">修改密碼</h2>
    <form id="changePwdForm" class="auth-form" onsubmit="return false;">
      <div class="password-wrapper">
        <input type="password" id="oldPwdInput" placeholder="請輸入『舊密碼』" required autocomplete="current-password">
        <i class="fas fa-eye-slash" id="toggleOldPasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <div class="password-wrapper">
        <input type="password" id="newPwdInput" placeholder="請輸入『新密碼』(4~20碼英數字)" required pattern="[a-zA-Z0-9]{4,20}" title="密碼長度需為 4~20 碼，且僅能使用英文與數字" autocomplete="new-password">
        <i class="fas fa-eye-slash" id="toggleNewPasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <div class="password-wrapper">
        <input type="password" id="confirmPwdInput" placeholder="再次確認『新密碼』" required pattern="[a-zA-Z0-9]{4,20}" autocomplete="new-password">
        <i class="fas fa-eye-slash" id="toggleConfirmPasswordBtn" title="顯示/隱藏密碼"></i>
      </div>
      <button type="submit" id="submitChangePwdBtn" class="auth-btn" style="background-color: var(--accent-color); box-shadow: 0 4px 0 #b37400;">確認修改密碼</button>
      <button type="button" id="cancelChangePwdBtn" class="auth-btn" style="background-color: #95a5a6; box-shadow: 0 4px 0 #7f8c8d; margin-top: -10px;">取消返回</button>
    </form>
  </div>

  <footer>
    <p>© 6767 阿公六七網 你的67好夥伴</p>
  </footer>

  <script src="auth.js?v=67.10"></script>
  <script src="admin.js?v=67.10"></script>
  <script src="script.js?v=67.10"></script>
</body>
</html>
